# Experiment 03: YOLOv8n on 14 classes, trained on the oversampled core-set subset.
# Imbalance handling = image-level oversampling (dataset side) + doubled classification loss.
model: yolov8n.pt
data: configs/datasets/cadot_14cls_oversampled.yaml
project: runs
name: 03_oversampled_14classes
exist_ok: true

epochs: 200
patience: 40
imgsz: 640
batch: 16
save_period: 20
workers: 4

optimizer: AdamW
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 5
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Loss weights: classification term doubled (default 0.5) to push rare-class separation.
box: 7.5
cls: 1.0
dfl: 1.5

# Moderate augmentation: the oversampled set already repeats minority images.
mosaic: 0.8
mixup: 0.2
copy_paste: 0.2
degrees: 10
translate: 0.1
scale: 0.5
shear: 2.0
perspective: 0.0
flipud: 0.5
fliplr: 0.5
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
erasing: 0.0
